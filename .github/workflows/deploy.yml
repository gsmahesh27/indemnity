name: Deploy website to InfinityFree

on:
  push:
    branches: [kuwait-eos-calculator]
    paths:
      - 'public/**'
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/deploy.yml'
      - '.github/scripts/deploy.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infinityfree-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out project
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate PHP and calculations
        run: |
          set -eu
          php -v
          find public src -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/calculator.php
          node tests/amount-words.mjs
      - name: Upload website over verified FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIRECTORY: ${{ vars.FTP_DIRECTORY || '/htdocs' }}
        run: python3 .github/scripts/deploy.py
